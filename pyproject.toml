[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chicago-food-inspection"
version = "0.1.0"
description = "Data analysis of Chicago food inspection records."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Babak Nikfar", email = "nikfar@nikintel.com" }]
license = { text = "MIT" }
keywords = ["data-analysis", "food-safety", "chicago", "eda", "hypothesis-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scipy",
    "PyYAML",
    "jupyterlab",
    "ipykernel",
    "nbformat",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chicago_food_inspection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]