# Chicago Food Inspection Analysis Configuration

# Paths configuration (relative to project root)
paths:
  data_dir: "data"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  outputs_dir: "outputs"
  figures_dir: "outputs/figures"
  reports_dir: "reports"
  logs_dir: "logs"


# Data configuration
data:
  raw_filename: "Food_Inspections_20260914.csv"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  cleaned_filename: "Food_Inspections_clean.parquet"

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s | %(name)s | %(levelname)s | %(message)s"
  file: "logs/food_inspection.log"